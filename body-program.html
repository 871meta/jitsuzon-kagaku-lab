function simulate(w,gender,goal,lv,months,inputBf){
  const male=gender==="male",base=male?.9:.45;
  const lvM=lv==="none"?1:lv==="beginner"?.85:lv==="intermediate"?.5:.3;
  const bfFloor=male?10:20,sRatio=lv==="none"||lv==="beginner"?.65:.5;
  const slowZone=male?5:3;
  const bmi=w/(1.7*1.7);
  let bf=inputBf?parseFloat(inputBf):male?Math.max(10,Math.min(40,bmi*1.2+.23*30-16.2)):Math.max(20,Math.min(48,bmi*1.2+.23*30-5.4));
  const belowFloor=bf<=bfFloor;
  let fm=w*(bf/100),lm=w-fm,cw=w;
  const res=[{m:0,w:r1(cw),lm:r1(lm),fm:r1(fm),bf:r1(bf)}];
  for(let i=1;i<=months;i++){
    if(goal==="cut"&&belowFloor){
      res.push({m:i,w:r1(cw),lm:r1(lm),fm:r1(fm),bf:r1(bf)});
      continue;
    }
    const td=1/(1+.03*i);
    let mg=base*lvM*td;
    if(goal==="cut"){
      mg*=lv==="none"?.4:.15;
      const curBf2=(fm/cw)*100;
      const dist2=Math.max(0,curBf2-bfFloor);
      if(dist2<slowZone) mg*=dist2/slowZone;
    }
    let fc=0;
    if(goal==="cut"){
      const curBf=(fm/cw)*100;
      const dist=Math.max(0,curBf-bfFloor);
      if(dist<0.5){fc=0;}
      else{
        const adapt=dist>=slowZone?1:dist/slowZone;
        const metaAdapt=1-Math.min(0.2,i*0.015);
        fc=(-500*adapt*metaAdapt*30)/7700;
      }
    }
    else if(goal==="bulk") fc=(300*30/7700)*(1-sRatio);
    lm+=mg;fm+=fc;
    const minF=lm*(bfFloor/(100-bfFloor));
    fm=Math.max(fm,minF);cw=lm+fm;bf=(fm/cw)*100;
    res.push({m:i,w:r1(cw),lm:r1(lm),fm:r1(fm),bf:r1(bf)});
  }
  return {res,belowFloor};
}

          <div style={st.cardL}>サプリメント（戦略的補完）</div>

          {[
            {nm:"ビタミンD3",amt:"2,000〜4,000 IU/日",dt:"免疫・骨代謝・テストステロン合成に関与。日光を十分に浴びない人は不足しやすい。血中25(OH)D濃度40〜60ng/mLが目安"},

            {nm:"亜鉛",amt:"15〜30mg/日",dt:"免疫・タンパク質合成・ホルモン代謝に関与。トレーニングで消耗しやすい。銅とのバランスに注意（亜鉛15mg以上なら銅1〜2mgの併用を推奨）"},
          ].map((s,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"10px 0",borderBottom:i<3?`1px solid ${C.bd}`:"none",gap:12}}>
            <div style={{flex:1}}><div style={{fontWeight:500,fontSize:14}}>{s.nm}</div><div style={{fontSize:12,color:C.td,lineHeight:1.7}}>{s.dt}</div></div>

          </div>)}
          <div style={{fontSize:12,color:C.td,marginTop:12,lineHeight:1.7,borderTop:`1px solid ${C.bd}`,paddingTop:10}}>※ サプリメントは食事の代替ではなく補完。PFCの土台が整っていることが前提です。持病がある方・服薬中の方は医師にご相談ください。</div>
        </div>
        <div style={{...st.note,marginTop:12,borderLeftColor:C.ac}}><strong style={{color:C.ac}}>なぜバランスが大事？</strong><br/><br/>タンパク質・脂質・炭水化物は掛け算の関係です。<br/><br/>どれか一つでも極端に足りないと、<br/>他がどんなに完璧でも身体は回復できません。<br/><br/>3つとも揃えることがスタートライン。</div>
      </div>}

      {tab==="training"&&<div>
        {prog.map((d,i)=><div key={i} style={{...st.card,marginBottom:14}}>
          <div style={st.cardL}>{d.day}</div>
          {d.ex.map((e,j)=>{const p=e.s.split("\u00d7");return(
            <div key={j} style={st.exR}>
              <div style={{flex:1}}><div style={{fontWeight:500,fontSize:14,marginBottom:2}}>{e.n}</div><div style={{fontSize:12,color:C.tm}}>{e.nt}</div></div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{display:"flex",gap:6,justifyContent:"flex-end",alignItems:"center"}}>
                  <span style={{...st.tag(C.ac),fontSize:12}}>{p[0]}セット</span>
                  <span style={{color:C.td,fontSize:11}}>\u00d7</span>
                  <span style={{...st.tag(C.bl),fontSize:12}}>{p[1]}回</span>
                </div>
                <div style={{fontSize:11,color:C.td,marginTop:4}}>{e.t}</div>
              </div>
            </div>
          )})}
        </div>)}
        <div style={st.note}><strong style={{color:C.ac}}>成長のカギ</strong><br/><br/>毎回のトレーニングで、前回より少しだけキツくする。<br/>（重量・回数・セットのどれか）<br/><br/>同じことを繰り返すだけでは、<br/>身体は「もう十分」と判断して成長を止めます。</div>
      </div>}

      {tab==="sleep"&&<div>
        {SLEEP.map((c,i)=><div key={i} style={{...st.card,marginBottom:12}}>
          <div style={st.cardL}>{c.cat}</div>
          {c.items.map((item,j)=><div key={j} style={st.chk}><div style={st.chkB}/><span>{item}</span></div>)}

      </div>}

      {tab==="priming"&&<div>
        {PRIM.map((p,i)=><div key={i} style={{...st.card,marginBottom:12}}>
          <div style={st.cardL}>{p.ph}</div>
          <div style={{fontSize:12,color:C.td,marginBottom:10}}>目的：{p.pur}</div>
          {p.st.map((s,j)=><div key={j} style={{...st.chk,borderBottom:j<p.st.length-1?`1px solid ${C.bd}`:"none",paddingBottom:8}}>
            <span style={{color:C.ac,fontWeight:700,fontSize:13,flexShrink:0,width:20}}>{j+1}</span>
            <span style={{fontSize:14}}>{s}</span>
          </div>)}
        </div>)}
        <div style={st.note}><strong style={{color:C.ac}}>「なぜ」が最も大事</strong><br/><br/>呼吸を整え、身体を動かし、<br/>最後に「今日、自分は何のために動くのか？」を確認する。<br/><br/>この「なぜ」がないと、<br/>ただの朝のルーティンで終わります。</div>
      </div>}

      {tab==="sim"&&<Sim w={w} gender={data.gender} goal={data.goal} lv={data.level} bf={data.bf} onBfChange={v=>setData({...data,bf:v})}/>}

      <div style={{marginTop:28,textAlign:"center",padding:"32px 0"}}>
        <div style={{marginBottom:24,padding:"20px 24px",background:C.sf,border:`1px solid ${C.bd}`,borderLeft:`3px solid ${C.ac}`,borderRadius:"0 10px 10px 0"}}>
          <div style={{fontSize:14,color:C.tm,marginBottom:12,lineHeight:1.8}}>このプログラムを実践した全記録：天命ボディ・ヒストリー</div>
          <a href="/body-history-001.html" style={{display:"inline-block",padding:"10px 24px",border:`1px solid ${C.ac}`,color:C.ac,borderRadius:8,fontSize:13,fontWeight:700,textDecoration:"none",letterSpacing:.5}}>全記録を読む →</a>
        </div>
        <div style={{marginBottom:24,padding:"20px 24px",background:C.sf,border:`1px solid ${C.bd}`,borderRadius:10}}>
          <div style={{fontSize:14,fontWeight:700,color:C.tx,marginBottom:8}}>この方程式の全体像を理解する</div>
          <div style={{fontSize:12,color:C.tm,marginBottom:12,lineHeight:1.7}}>なぜ運動\u00d7栄養\u00d7睡眠が掛け算なのか。なぜ天命が必要なのか。<br/>身体論の7つの構造原理を、わかりやすく解説しています。</div>
          <a href="/body-manual.html" style={{display:"inline-block",padding:"10px 24px",border:`1px solid ${C.ac}`,color:C.ac,borderRadius:8,fontSize:13,fontWeight:700,textDecoration:"none",letterSpacing:.5}}>天命ボディマニュアルを読む →</a>
        </div>
        <div style={{fontSize:15,fontWeight:700,lineHeight:2}}>天命ボディを<br/>最短最速で手に入れたい方は<br/><span style={{color:C.ac}}>「天命の言語化セッション\u2122」</span>へ！</div>
        <a href="/trial.html" style={{display:"inline-block",marginTop:16,padding:"14px 32px",background:C.ac,color:C.bg,borderRadius:8,fontSize:14,fontWeight:700,textDecoration:"none",letterSpacing:.5}}>無料トライアルはこちら →</a>
      </div>
    </div>
  );
}
function App(){
  const[step,setStep]=useState(0),[src,setSrc]=useState(false);
  const[data,setData]=useState({gender:"male",age:"",height:"",weight:"",bf:"",env:"gym",level:"beginner",goal:"recomp",days:"3",diet:"none",dietNote:""});
  const ok=step===0?data.age&&data.height&&data.weight:step===1?data.env&&data.level&&data.goal&&data.days:true;
  return(
    <div style={st.app}><div style={st.ctn}>
      <div style={st.hdr}><div style={st.hdrL}>Tenmei Body Program</div><h1 style={st.h1}>天命ボディプログラム</h1><p style={st.hdrS}>T · A ⇒ Pmax ── 天命を全うするための身体の方程式</p></div>
      <div style={st.dots}>{["a","b","c","d"].map((s,i)=><div key={s} style={st.dot(i===step)}/>)}</div>
      {step===0&&<S1 d={data} set={setData}/>}
      {step===1&&<S2 d={data} set={setData}/>}
      {step===2&&<S3 d={data} set={setData}/>}
      {step===3&&<Res data={data} setData={setData}/>}
      {step<3&&<div style={st.btnR}>{step>0&&<button style={st.btn(false)} onClick={()=>setStep(step-1)}>戻る</button>}<button style={{...st.btn(true),opacity:ok?1:.4,pointerEvents:ok?"auto":"none"}} onClick={()=>setStep(step+1)}>{step===2?"結果を見る":"次へ"}</button></div>}
      {step===3&&<div style={st.btnR}><button style={st.btn(false)} onClick={()=>setStep(0)}>最初からやり直す</button></div>}
      <div style={st.ft}>Based on「身体論 ── 天命を全うするための身体の方程式」<br/>© 実存科学研究所<div style={{marginTop:16}}><button onClick={()=>setSrc(!src)} style={{background:"none",border:`1px solid ${C.bd}`,borderRadius:6,padding:"8px 18px",color:C.tm,fontSize:12,fontFamily:"inherit",cursor:"pointer",letterSpacing:.5}}>{src?"閉じる":"算出根拠・参考文献 →"}</button></div></div>
      {src&&<div style={{paddingBottom:48}}><div style={{borderTop:`1px solid ${C.bd}`,paddingTop:32}}>
        <div style={st.secL}>Evidence Base</div>
        <h2 style={{...st.h2,marginBottom:24}}>算出根拠・参考文献</h2>
        {EVIDENCE.map((e,i)=><div key={i} style={{...st.card,marginBottom:14}}>
          <div style={st.cardL}>{e.title}</div>
          <div style={{fontSize:13,color:C.tm,lineHeight:1.8,marginBottom:8}}>{e.body}</div>
          <div style={{fontSize:11,color:C.td,fontStyle:"italic"}}>{e.ref}</div>
        </div>)}
        <div style={{...st.card,borderLeft:`3px solid ${C.ac}`}}>
          <div style={st.cardL}>理論的基盤</div>
          <div style={{fontSize:13,color:C.tm,lineHeight:1.8}}>本プログラムは「身体論 ── 天命を全うするための身体の方程式」（実存科学研究所）に基づく。T·A⇒Pmax、積のモデル、三層アロスタシスモデル、7つの構造原理が設計の骨格。15学術領域・38名の世界的権威の研究知見を参照枠とする。</div>
          <div style={{fontSize:11,color:C.td,marginTop:8}}>原典：<a href="/body.html" style={{color:C.ac}}>jitsuzon-kagaku-lab.yanaihiroki.com/body.html</a></div>
        </div>
        <div style={{...st.note,borderLeftColor:C.td,marginTop:20}}><strong style={{color:C.tm}}>注記：</strong> 本プログラムの数値はエビデンスに基づく推定値であり個体差があります。開始値として使用し、2〜3週間の体重変動を観察して調整を推奨します。既往歴のある方は医師にご相談ください。</div>
      </div></div>}
    </div></div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
