<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>書 — 実存科学研究所</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0812;
-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0;cursor:crosshair}
#hint{position:fixed;bottom:2.4rem;left:0;right:0;text-align:center;
font-family:'Cormorant Garamond','Shippori Mincho',serif;
font-size:.72rem;letter-spacing:.28em;color:rgba(192,168,120,0);
transition:color 2.4s ease;pointer-events:none;user-select:none}
#hint.show{color:rgba(192,168,120,.32)}
#hint.fade{color:rgba(192,168,120,0)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">闇に、書く</div>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

let W, H, dpr;
let interacted = false;
let strokes = [];      // all completed strokes
let currentStroke = null;
let fadeTimer = 0;
let idleTime = 0;

// ── Resize ──
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}

// ── Brush physics ──
// A stroke is a series of points with pressure/velocity data
// Rendered as connected quadratic curves with varying width

class Stroke {
  constructor() {
    this.points = [];
    this.birth = performance.now();
    this.alpha = 1;
    this.fading = false;
    this.fadeStart = 0;
    this.fadeDuration = 4000 + Math.random() * 3000; // 4-7s fade
    this.inkDensity = 0.7 + Math.random() * 0.3;
  }

  addPoint(x, y, pressure, time) {
    const last = this.points[this.points.length - 1];
    let speed = 0;
    if (last) {
      const dx = x - last.x, dy = y - last.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const dt = Math.max(time - last.time, 1);
      speed = dist / dt;
    }
    this.points.push({ x, y, pressure, speed, time });
  }

  startFade() {
    if (!this.fading) {
      this.fading = true;
      this.fadeStart = performance.now();
    }
  }

  getAlpha() {
    if (!this.fading) return this.alpha;
    const elapsed = performance.now() - this.fadeStart;
    const progress = Math.min(elapsed / this.fadeDuration, 1);
    // Ease out cubic - like ink dissolving
    this.alpha = 1 - progress * progress * progress;
    return this.alpha;
  }

  isDead() {
    return this.fading && this.alpha <= 0.005;
  }

  draw(ctx) {
    const pts = this.points;
    if (pts.length < 2) return;

    const alpha = this.getAlpha();
    if (alpha <= 0) return;

    const density = this.inkDensity;

    // Main ink stroke
    for (let i = 1; i < pts.length; i++) {
      const prev = pts[i - 1];
      const curr = pts[i];

      // Width based on speed: slow = thick, fast = thin (like real brush)
      const speedFactor = Math.min(curr.speed * 8, 1);
      const baseWidth = 2.5 + (1 - speedFactor) * 18;

      // Pressure influence
      const pressureWidth = baseWidth * (0.5 + curr.pressure * 0.5);

      // Taper at start and end
      const startTaper = Math.min(i / 8, 1);
      const endTaper = Math.min((pts.length - i) / 6, 1);
      const taper = startTaper * endTaper;

      const width = pressureWidth * taper;

      // Gold ink color with subtle variation
      const goldR = 185 + Math.sin(i * 0.3) * 12;
      const goldG = 162 + Math.sin(i * 0.2 + 1) * 10;
      const goldB = 110 + Math.sin(i * 0.15 + 2) * 15;

      // Main stroke
      ctx.strokeStyle = `rgba(${goldR|0},${goldG|0},${goldB|0},${alpha * density * 0.85})`;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);

      // Smooth with quadratic curve through midpoint
      if (i < pts.length - 1) {
        const next = pts[i + 1];
        const mx = (curr.x + next.x) / 2;
        const my = (curr.y + next.y) / 2;
        ctx.quadraticCurveTo(curr.x, curr.y, mx, my);
      } else {
        ctx.lineTo(curr.x, curr.y);
      }
      ctx.stroke();

      // Ink bleed / texture - scattered particles around stroke
      if (width > 4 && Math.random() < 0.35) {
        const bleedCount = (width * 0.3) | 0;
        for (let j = 0; j < bleedCount; j++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = width * 0.4 + Math.random() * width * 0.6;
          const bx = curr.x + Math.cos(angle) * dist;
          const by = curr.y + Math.sin(angle) * dist;
          const bSize = 0.3 + Math.random() * 1.2;
          const bAlpha = alpha * density * (0.05 + Math.random() * 0.12);
          ctx.fillStyle = `rgba(${goldR|0},${goldG|0},${goldB|0},${bAlpha})`;
          ctx.beginPath();
          ctx.arc(bx, by, bSize, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Kasure (かすれ) - dry brush effect when moving fast
      if (speedFactor > 0.5 && Math.random() < speedFactor * 0.6) {
        // Skip some rendering to create gaps
        const gapAlpha = alpha * density * 0.15;
        ctx.strokeStyle = `rgba(${goldR|0},${goldG|0},${goldB|0},${gapAlpha})`;
        ctx.lineWidth = width * 0.3;
        ctx.beginPath();
        ctx.moveTo(prev.x + (Math.random() - 0.5) * width * 0.5,
                   prev.y + (Math.random() - 0.5) * width * 0.5);
        ctx.lineTo(curr.x + (Math.random() - 0.5) * width * 0.5,
                   curr.y + (Math.random() - 0.5) * width * 0.5);
        ctx.stroke();
      }
    }

    // Ink pooling at start point (筆の入り)
    if (pts.length > 2 && alpha > 0.3) {
      const start = pts[0];
      const poolSize = 3 + (1 - Math.min(pts[1].speed * 10, 1)) * 6;
      const grad = ctx.createRadialGradient(
        start.x, start.y, 0, start.x, start.y, poolSize
      );
      grad.addColorStop(0, `rgba(185,162,110,${alpha * density * 0.3})`);
      grad.addColorStop(0.5, `rgba(185,162,110,${alpha * density * 0.12})`);
      grad.addColorStop(1, `rgba(185,162,110,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(start.x, start.y, poolSize, 0, Math.PI * 2);
      ctx.fill();
    }

    // Subtle glow underneath
    if (alpha > 0.15) {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < pts.length; i += 4) {
        const p = pts[i];
        const glowSize = 12 + (1 - Math.min(p.speed * 8, 1)) * 8;
        ctx.fillStyle = `rgba(192,168,120,${alpha * 0.018})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, glowSize, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

// ── Ink drip effect ──
// When holding still, ink slowly drips down
let drips = [];

class Drip {
  constructor(x, y) {
    this.x = x + (Math.random() - 0.5) * 4;
    this.y = y;
    this.vy = 0;
    this.size = 1 + Math.random() * 2;
    this.alpha = 0.4 + Math.random() * 0.3;
    this.life = 0;
    this.maxLife = 120 + Math.random() * 180;
  }

  update() {
    this.life++;
    this.vy += 0.015 + Math.random() * 0.008;
    this.vy *= 0.995;
    this.y += this.vy;
    this.x += (Math.random() - 0.5) * 0.2;
    this.size *= 0.998;

    if (this.life > this.maxLife * 0.6) {
      this.alpha *= 0.97;
    }
    return this.life < this.maxLife && this.alpha > 0.01;
  }

  draw(ctx) {
    // Elongated drop shape
    const elongation = 1 + this.vy * 2;
    ctx.fillStyle = `rgba(185,162,110,${this.alpha * 0.5})`;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.size * 0.6, this.size * elongation, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Nijimi (滲み) effect ──
// After stroke is complete, ink slowly bleeds outward
function addNijimi(stroke) {
  const pts = stroke.points;
  if (pts.length < 3) return;

  // Pick a few random points along the stroke to bleed from
  const count = Math.min(pts.length, 5);
  for (let i = 0; i < count; i++) {
    const idx = (Math.random() * pts.length) | 0;
    const p = pts[idx];
    if (p.speed < 0.08) { // Only bleed where brush moved slowly
      for (let j = 0; j < 3; j++) {
        drips.push(new Drip(p.x, p.y));
      }
    }
  }
}

// ── Drawing state ──
let lastPointerTime = 0;
let pointerHoldPos = null;
let holdDripTimer = 0;

function onPointerDown(e) {
  e.preventDefault();
  if (!interacted) {
    interacted = true;
    hint.classList.remove('show');
    hint.classList.add('fade');
  }

  idleTime = 0;
  const pressure = e.pressure || 0.5;
  currentStroke = new Stroke();
  currentStroke.addPoint(e.clientX, e.clientY, pressure, performance.now());
  pointerHoldPos = { x: e.clientX, y: e.clientY };
  holdDripTimer = 0;
}

function onPointerMove(e) {
  e.preventDefault();
  if (!currentStroke) return;

  idleTime = 0;
  const pressure = e.pressure || 0.5;
  const time = performance.now();

  // Interpolate if pointer moved far (smooth on mobile)
  const last = currentStroke.points[currentStroke.points.length - 1];
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist > 2) {
    const steps = Math.min((dist / 3) | 0, 8);
    for (let i = 1; i <= steps; i++) {
      const t = i / (steps + 1);
      currentStroke.addPoint(
        last.x + dx * t,
        last.y + dy * t,
        pressure,
        time - (steps - i) * 2
      );
    }
    currentStroke.addPoint(e.clientX, e.clientY, pressure, time);
    pointerHoldPos = { x: e.clientX, y: e.clientY };
    holdDripTimer = 0;
  }
}

function onPointerUp(e) {
  e.preventDefault();
  if (currentStroke && currentStroke.points.length > 1) {
    addNijimi(currentStroke);
    strokes.push(currentStroke);

    // Start fading after a pause
    const s = currentStroke;
    setTimeout(() => s.startFade(), 2500 + Math.random() * 2000);
  }
  currentStroke = null;
  pointerHoldPos = null;
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('pointerleave', onPointerUp);

// ── Redraw everything ──
function redraw() {
  ctx.fillStyle = '#0a0812';
  ctx.fillRect(0, 0, W, H);

  for (const s of strokes) {
    s.draw(ctx);
  }
  if (currentStroke) {
    currentStroke.draw(ctx);
  }
  for (const d of drips) {
    d.draw(ctx);
  }
}

// ── Main loop ──
function frame() {
  idleTime++;

  // Clear and redraw (needed for fading strokes)
  ctx.fillStyle = '#0a0812';
  ctx.fillRect(0, 0, W, H);

  // Update and draw strokes
  strokes = strokes.filter(s => !s.isDead());
  for (const s of strokes) {
    s.draw(ctx);
  }

  // Draw current stroke
  if (currentStroke) {
    currentStroke.draw(ctx);

    // Drip when holding still
    if (pointerHoldPos) {
      holdDripTimer++;
      if (holdDripTimer > 30 && Math.random() < 0.08) {
        drips.push(new Drip(pointerHoldPos.x, pointerHoldPos.y));
      }
    }
  }

  // Update drips
  drips = drips.filter(d => d.update());
  for (const d of drips) {
    d.draw(ctx);
  }

  requestAnimationFrame(frame);
}

// ── Init ──
resize();
window.addEventListener('resize', resize);

ctx.fillStyle = '#0a0812';
ctx.fillRect(0, 0, W, H);

setTimeout(() => hint.classList.add('show'), 800);

frame();
</script>
</body>
</html>
