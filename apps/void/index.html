<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>void — 実存科学研究所</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0812;cursor:crosshair;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;top:0;left:0}
#hint{position:fixed;bottom:2.4rem;left:0;right:0;text-align:center;
font-family:'Cormorant Garamond','Shippori Mincho',serif;
font-size:.72rem;letter-spacing:.28em;color:rgba(192,168,120,.0);
transition:color 2.4s ease;pointer-events:none;user-select:none}
#hint.show{color:rgba(192,168,120,.35)}
#hint.fade{color:rgba(192,168,120,.0)}
#words{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
.word{position:absolute;font-family:'Cormorant Garamond','Shippori Mincho',serif;
font-weight:300;letter-spacing:.18em;color:rgba(192,168,120,0);
transition:none;pointer-events:none;user-select:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="words"></div>
<div id="hint">touch the void</div>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wordsEl = document.getElementById('words');
const hint = document.getElementById('hint');

let W, H, dpr;
let particles = [];
let seeds = [];
let time = 0;
let interacted = false;
let hintTimer;

const PHRASES = [
  '天命', '運命の交差', '虚空', '始原', 'Meta',
  '存在', '自由意志', '深淵', '根源', '覚醒',
  '因果', '螺旋', '無限', '原初', '黄金',
  'destiny', 'void', 'origin', 'emergence', 'singularity'
];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Noise - simplex-like
const perm = new Uint8Array(512);
(function() {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
})();

function noise2d(x, y) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = perm[X] + Y, b = perm[X + 1] + Y;
  const aa = perm[a], ab = perm[a + 1], ba = perm[b], bb = perm[b + 1];
  return (aa * (1 - u) + ba * u) * (1 - v) + (ab * (1 - u) + bb * u) * v;
}

function flowAngle(x, y, t) {
  const scale = 0.0018;
  const n1 = noise2d(x * scale + t * 0.12, y * scale + t * 0.08);
  const n2 = noise2d(x * scale * 1.4 - t * 0.06, y * scale * 1.4 + t * 0.1);
  const n3 = noise2d(x * scale * 0.5 + t * 0.15, y * scale * 0.5 - t * 0.05);
  return ((n1 + n2 * 0.7 + n3 * 0.4) / 512) * Math.PI * 8;
}

class Particle {
  constructor(x, y, seedId) {
    this.x = x + (Math.random() - 0.5) * 30;
    this.y = y + (Math.random() - 0.5) * 30;
    this.ox = this.x;
    this.oy = this.y;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = (Math.random() - 0.5) * 1.2;
    this.life = 0;
    this.maxLife = 300 + Math.random() * 500;
    this.seedId = seedId;
    this.hueShift = Math.random() * 20 - 10;
    this.size = 0.5 + Math.random() * 1.5;
    this.wanderAngle = Math.random() * Math.PI * 2;
    this.wanderSpeed = 0.002 + Math.random() * 0.008;
    this.speed = 0.3 + Math.random() * 0.7;
  }

  update(t) {
    this.life++;
    if (this.life > this.maxLife) return false;

    const angle = flowAngle(this.x, this.y, t);
    this.wanderAngle += (Math.random() - 0.5) * 0.3;

    const fx = Math.cos(angle) * this.speed;
    const fy = Math.sin(angle) * this.speed;
    const wx = Math.cos(this.wanderAngle) * 0.15;
    const wy = Math.sin(this.wanderAngle) * 0.15;

    this.vx += (fx + wx) * 0.06;
    this.vy += (fy + wy) * 0.06;
    this.vx *= 0.985;
    this.vy *= 0.985;

    // Attract gently toward other seeds
    for (const s of seeds) {
      if (s.id === this.seedId) continue;
      const dx = s.x - this.x, dy = s.y - this.y;
      const d = Math.sqrt(dx * dx + dy * dy) + 1;
      if (d < 300) {
        const f = 0.02 / (d * 0.1 + 1);
        this.vx += dx / d * f;
        this.vy += dy / d * f;
      }
    }

    this.ox = this.x;
    this.oy = this.y;
    this.x += this.vx;
    this.y += this.vy;

    return true;
  }

  draw(ctx) {
    const progress = this.life / this.maxLife;
    const fadeIn = Math.min(this.life / 30, 1);
    const fadeOut = progress > 0.7 ? 1 - (progress - 0.7) / 0.3 : 1;
    const alpha = fadeIn * fadeOut * 0.55;

    if (alpha <= 0) return;

    // Gold to purple gradient over lifetime
    const goldR = 192 + this.hueShift * 0.5;
    const goldG = 168 - progress * 40 + this.hueShift * 0.3;
    const goldB = 120 + progress * 80;

    ctx.strokeStyle = `rgba(${goldR|0},${goldG|0},${goldB|0},${alpha})`;
    ctx.lineWidth = this.size * (1 - progress * 0.4);
    ctx.beginPath();
    ctx.moveTo(this.ox, this.oy);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();

    // Glow
    if (progress < 0.3 && alpha > 0.2) {
      ctx.fillStyle = `rgba(${goldR|0},${goldG|0},${goldB|0},${alpha * 0.12})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

let seedCounter = 0;

function spawnSeed(x, y) {
  const id = seedCounter++;
  seeds.push({ x, y, id, time: time });
  const count = 40 + Math.random() * 60 | 0;
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, id));
  }

  // Occasionally spawn a word
  if (Math.random() < 0.35) {
    spawnWord(x, y);
  }
}

function spawnWord(x, y) {
  const word = PHRASES[Math.random() * PHRASES.length | 0];
  const el = document.createElement('div');
  el.className = 'word';
  el.textContent = word;

  const isJa = /[\u3000-\u9fff]/.test(word);
  const size = isJa ? (0.8 + Math.random() * 0.6) : (0.7 + Math.random() * 0.5);
  el.style.fontSize = size + 'rem';

  const ox = (Math.random() - 0.5) * 120;
  const oy = (Math.random() - 0.5) * 80;
  el.style.left = (x + ox) + 'px';
  el.style.top = (y + oy) + 'px';
  el.style.transform = 'translateY(8px)';

  wordsEl.appendChild(el);

  // Animate
  let frame = 0;
  const duration = 180 + Math.random() * 120;
  const fadeInEnd = 40;
  const fadeOutStart = duration - 60;

  function animateWord() {
    frame++;
    if (frame > duration) {
      el.remove();
      return;
    }
    let a = 0;
    if (frame < fadeInEnd) a = (frame / fadeInEnd) * 0.28;
    else if (frame > fadeOutStart) a = 0.28 * (1 - (frame - fadeOutStart) / (duration - fadeOutStart));
    else a = 0.28;

    const drift = frame * 0.08;
    el.style.color = `rgba(192,168,120,${a})`;
    el.style.transform = `translateY(${8 - drift}px)`;
    requestAnimationFrame(animateWord);
  }
  requestAnimationFrame(animateWord);
}

// Auto-spawn ambient particles
function autoSpawn() {
  if (particles.length < 200) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    spawnSeed(x, y);
  }
}

// Interaction
function onPointer(e) {
  e.preventDefault();
  if (!interacted) {
    interacted = true;
    hint.classList.remove('show');
    hint.classList.add('fade');
  }

  const touches = e.touches ? e.touches : [e];
  for (let i = 0; i < touches.length; i++) {
    const t = touches[i];
    const x = t.clientX || t.pageX;
    const y = t.clientY || t.pageY;
    spawnSeed(x, y);
  }
}

canvas.addEventListener('pointerdown', onPointer);
canvas.addEventListener('pointermove', (e) => {
  if (e.buttons > 0 || e.pointerType === 'touch') {
    if (Math.random() < 0.3) {
      spawnSeed(e.clientX, e.clientY);
    }
  }
});

// Main loop
function frame() {
  time += 0.008;

  // Slow fade background
  ctx.fillStyle = 'rgba(10,8,18,0.028)';
  ctx.fillRect(0, 0, W, H);

  // Update & draw particles
  let alive = [];
  for (const p of particles) {
    if (p.update(time)) {
      p.draw(ctx);
      alive.push(p);
    }
  }
  particles = alive;

  // Clean old seeds
  if (seeds.length > 30) {
    seeds = seeds.slice(-20);
  }

  // Auto-spawn ambient life
  if (Math.random() < 0.012) {
    autoSpawn();
  }

  requestAnimationFrame(frame);
}

// Init
resize();
window.addEventListener('resize', resize);

// Clear canvas fully
ctx.fillStyle = '#0a0812';
ctx.fillRect(0, 0, W, H);

// Show hint
setTimeout(() => hint.classList.add('show'), 800);

// Initial ambient spawn
for (let i = 0; i < 3; i++) {
  setTimeout(() => autoSpawn(), i * 1200);
}

frame();
</script>
</body>
</html>
