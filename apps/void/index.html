<script>
'use strict';

// ══════════════════════════════════════
// QUOTES — 実存科学研究所の名言・概念
// ══════════════════════════════════════
const QUOTES = [

  { text: 'あなたは自分の意思で\n「考えている」のではなく、\n構造の影響下で\n「考えさせられている」', source: 'Meta' },
  { text: '構造が見えれば、\n恐怖は自然に崩壊する', source: '恐怖論' },

// Shuffle quotes for this session
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let quoteQueue = shuffle(QUOTES);
let quoteIndex = 0;

function nextQuote() {
  if (quoteIndex >= quoteQueue.length) {
    quoteQueue = shuffle(QUOTES);
    quoteIndex = 0;
  }
  return quoteQueue[quoteIndex++];
}

// ══════════════════════════════════════
// WebGL Background Shader
// ══════════════════════════════════════
const canvas = document.getElementById('bg');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

let W, H;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}

const vertSrc = `attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0,1);}`;

const fragSrc = `
precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}

float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0,.5,1,2);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0,i1.z,i2.z,1))+i.y+vec4(0,i1.y,i2.y,1))+i.x+vec4(0,i1.x,i2.x,1));
  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;
  vec4 sh=-step(h,vec4(0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

float fbm(vec3 p){
  float f=0.,a=.5;
  for(int i=0;i<5;i++){f+=a*snoise(p);p=p*2.1+vec3(.3);a*=.48;
    p.xy=mat2(.8,.6,-.6,.8)*p.xy;}
  return f;
}

float warped(vec3 p){
  float t=u_time*0.04;
  vec3 q=vec3(fbm(p+vec3(1.7,9.2,0)+t*.3),fbm(p+vec3(8.3,2.8,0)+t*.2),0.);
  vec3 r=vec3(fbm(p+3.5*q+vec3(1.7,9.2,0)+t*.15),fbm(p+3.5*q+vec3(8.3,2.8,0)+t*.12),0.);
  return fbm(p+3.*r);
}

void main(){
  vec2 uv=gl_FragCoord.xy/u_resolution;
  vec2 p=(gl_FragCoord.xy*2.-u_resolution)/min(u_resolution.x,u_resolution.y);
  float t=u_time*0.03;

  float n1=warped(vec3(p*.7,t*.5));
  float n2=warped(vec3(p*1.3+3.,t*.6));
  float n3=fbm(vec3(p*2.+n1*.5,t*.8));
  float lum=n1*.45+n2*.3+n3*.25+.5;

  // Alcohol ink palette: deep navy, indigo, violet, lavender, gold veins
  vec3 c_void=vec3(.02,.015,.05);
  vec3 c_navy=vec3(.06,.04,.18);
  vec3 c_indigo=vec3(.14,.08,.32);
  vec3 c_violet=vec3(.35,.18,.50);
  vec3 c_lavender=vec3(.50,.44,.65);
  vec3 c_gold=vec3(.75,.62,.30);

  // Gold veins
  float gv=abs(fbm(vec3(p*1.6+n1*1.,t*.25)));
  float vein=1.-smoothstep(0.,.07,gv);
  float glow=1.-smoothstep(0.,.22,gv);

  vec3 col=c_void;
  col=mix(col,c_navy,smoothstep(.3,.5,lum));
  col=mix(col,c_indigo,smoothstep(.4,.6,lum)*.7);

  float pm=smoothstep(-.15,.5,warped(vec3(p*.8+1.,t*.5)));
  col=mix(col,c_violet,pm*.5);
  col=mix(col,c_lavender,smoothstep(.65,.85,lum)*.3);

  col=mix(col,c_gold*.6,glow*.25);
  col=mix(col,c_gold,vein*.5);

  // Darken significantly for text readability — this is a background
  col*=0.35;

  float vig=1.-length(uv-.5)*.7;
  col*=smoothstep(0.,1.,vig);

  col+=((fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)*.012);
  gl_FragColor=vec4(col,1);
}
`;

let glReady = false;
let uTime, uRes;

function initGL() {
  if (!gl) return false;
  try {
    function createShader(type,src){
      const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
        console.error('Shader error:',gl.getShaderInfoLog(s));return null;}
      return s;
    }
    const vs=createShader(gl.VERTEX_SHADER,vertSrc);
    const fs=createShader(gl.FRAGMENT_SHADER,fragSrc);
    if(!vs||!fs) return false;
    const prog=gl.createProgram();
    gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){
      console.error('Program error:',gl.getProgramInfoLog(prog));return false;}
    gl.useProgram(prog);
    const buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const aPos=gl.getAttribLocation(prog,'a_pos');
    gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
    uTime=gl.getUniformLocation(prog,'u_time');
    uRes=gl.getUniformLocation(prog,'u_resolution');
    return true;
  } catch(e) { console.error('WebGL init failed:',e); return false; }
}

glReady = initGL();

// CSS fallback if WebGL fails
if (!glReady) {
  canvas.style.background = 'radial-gradient(ellipse at 30% 40%, rgba(14,8,32,1) 0%, rgba(6,5,10,1) 60%)';
}

// ══════════════════════════════════════
// Stars — scattered points of light
// ══════════════════════════════════════
const starsEl = document.getElementById('stars');
const NUM_STARS = 80;
const starEls = [];

function createStars() {
  for (let i = 0; i < NUM_STARS; i++) {
    const el = document.createElement('div');
    el.className = 'star';
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    el.style.left = x + '%';
    el.style.top = y + '%';
    const size = 1 + Math.random() * 2.5;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    // Twinkle
    el.dataset.phase = Math.random() * Math.PI * 2;
    el.dataset.speed = 0.3 + Math.random() * 0.7;
    el.dataset.baseAlpha = 0.06 + Math.random() * 0.18;
    starsEl.appendChild(el);
    starEls.push(el);
  }
}

function updateStars(t) {
  for (const el of starEls) {
    const phase = parseFloat(el.dataset.phase);
    const speed = parseFloat(el.dataset.speed);
    const base = parseFloat(el.dataset.baseAlpha);
    const twinkle = Math.sin(t * speed + phase) * 0.5 + 0.5;
    const alpha = base + twinkle * 0.15;
    el.style.background = `rgba(192,168,120,${alpha})`;
    if (twinkle > 0.85) {
      el.style.boxShadow = `0 0 ${3 + twinkle * 3}px rgba(192,168,120,${alpha * 0.5})`;
    } else {
      el.style.boxShadow = 'none';
    }
  }
}

// ══════════════════════════════════════
// Cinematic Quote Animation
// ══════════════════════════════════════
const quoteLinesEl = document.getElementById('quote-lines');
const sourceEl = document.getElementById('source');
const hintEl = document.getElementById('hint');
const goldTop = document.getElementById('gold-line-top');
const goldBottom = document.getElementById('gold-line-bottom');

let quoteVisible = false;
let quoteAnimating = false;
let fadeOutTimer = null;
let hintShown = false;

function showQuote() {
  if (quoteAnimating) return;
  quoteAnimating = true;

  const q = nextQuote();

  if (quoteVisible) {
    cinematicFadeOut(() => {
      cinematicReveal(q);
    });
  } else {
    cinematicReveal(q);
  }
}

function cinematicReveal(q) {
  quoteVisible = true;
  const lines = q.text.split('\n');

  // Clear previous
  quoteLinesEl.innerHTML = '';
  sourceEl.textContent = '── ' + q.source;
  sourceEl.style.color = 'rgba(192,168,120,0)';
  sourceEl.style.transform = 'translateY(4px)';

  // Create line elements
  const lineEls = lines.map(text => {
    const el = document.createElement('div');
    el.className = 'q-line';
    el.textContent = text;
    quoteLinesEl.appendChild(el);
    return el;
  });

  // Gold lines expand
  goldTop.style.width = '0';
  goldBottom.style.width = '0';
  requestAnimationFrame(() => {
    goldTop.style.width = 'min(320px, 60vw)';
    goldBottom.style.width = 'min(320px, 60vw)';
  });

  // Reveal each line with delay
  lineEls.forEach((el, i) => {
    const delay = 400 + i * 500; // 500ms between each line
    setTimeout(() => {
      animateLineIn(el);
    }, delay);
  });

  // Source appears after all lines
  const sourceDelay = 400 + lineEls.length * 500 + 600;
  setTimeout(() => {
    animateElement(sourceEl, 0, 0.35, 0.005, 4, 0);
  }, sourceDelay);

  // Mark animation complete
  const totalDelay = sourceDelay + 800;
  setTimeout(() => {
    quoteAnimating = false;
    // Auto fade out
    clearTimeout(fadeOutTimer);
    fadeOutTimer = setTimeout(() => {
      cinematicFadeOut(() => { quoteVisible = false; });
    }, 5000 + Math.random() * 2000);
  }, totalDelay);
}

function animateLineIn(el) {
  let alpha = 0;
  let y = 8;
  const step = () => {
    alpha += 0.012;
    y *= 0.92;
    if (alpha >= 0.88) {
      el.style.color = 'rgba(192,168,120,0.88)';
      el.style.transform = 'translateY(0)';
      return;
    }
    el.style.color = `rgba(192,168,120,${alpha})`;
    el.style.transform = `translateY(${y}px)`;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function animateElement(el, from, to, speed, yFrom, yTo) {
  let alpha = from;
  let y = yFrom;
  const step = () => {
    alpha += speed;
    y += (yTo - y) * 0.08;
    if ((speed > 0 && alpha >= to) || (speed < 0 && alpha <= to)) {
      el.style.color = `rgba(192,168,120,${to})`;
      el.style.transform = `translateY(${yTo}px)`;
      return;
    }
    el.style.color = `rgba(192,168,120,${alpha})`;
    el.style.transform = `translateY(${y}px)`;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function cinematicFadeOut(cb) {
  const lines = quoteLinesEl.querySelectorAll('.q-line');

  // Fade gold lines
  goldTop.style.width = '0';
  goldBottom.style.width = '0';

  // Fade source first
  animateElement(sourceEl, 0.35, 0, -0.008, 0, -4);

  // Fade lines in reverse order
  const lineArr = Array.from(lines).reverse();
  lineArr.forEach((el, i) => {
    setTimeout(() => {
      let alpha = 0.88;
      const step = () => {
        alpha -= 0.018;
        if (alpha <= 0) {
          el.style.color = 'rgba(192,168,120,0)';
          return;
        }
        el.style.color = `rgba(192,168,120,${alpha})`;
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, i * 150);
  });

  // Callback after all faded
  setTimeout(() => {
    if (cb) cb();
  }, lineArr.length * 150 + 600);
}

// ══════════════════════════════════════
// Interaction
// ══════════════════════════════════════
const ui = document.getElementById('ui');

ui.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!hintShown) {
    hintShown = true;
    hintEl.style.transition = 'color 2s ease';
    hintEl.style.color = 'rgba(192,168,120,0)';
  }
  showQuote();
});

// ══════════════════════════════════════
// Main loop
// ══════════════════════════════════════
const t0 = performance.now();

function frame() {
  const t = (performance.now() - t0) * 0.001;

  if (glReady) {
    gl.uniform1f(uTime, t);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  updateStars(t);

  requestAnimationFrame(frame);
}

// ══════════════════════════════════════
// Init
// ══════════════════════════════════════
resize();
window.addEventListener('resize', resize);
createStars();

// Show hint
setTimeout(() => {
  hintEl.style.transition = 'color 3s ease';
  hintEl.style.color = 'rgba(192,168,120,.25)';
}, 800);

// Show first quote automatically after a moment
setTimeout(() => showQuote(), 2800);

frame();
</script>
</body>
</html>
