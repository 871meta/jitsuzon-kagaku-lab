<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>void — 実存科学研究所</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06050a;
-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0}
#hint{position:fixed;bottom:2rem;left:0;right:0;text-align:center;
font-family:'Cormorant Garamond',serif;
font-size:.68rem;letter-spacing:.32em;color:rgba(192,168,120,0);
transition:color 3s ease;pointer-events:none;user-select:none}
#hint.show{color:rgba(192,168,120,.25)}
#hint.fade{color:rgba(192,168,120,0)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">touch to disturb</div>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

let W, H, dpr;
let interacted = false;
let time = 0;

// ── Resize ──
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ── Strange Attractors ──
const attractors = [];
const NUM_ATTRACTORS = 4;

for (let i = 0; i < NUM_ATTRACTORS; i++) {
  attractors.push({
    x: 0, y: 0, z: 0,
    sigma: 10 + (Math.random() - 0.5) * 2,
    rho: 28 + (Math.random() - 0.5) * 4,
    beta: 8/3 + (Math.random() - 0.5) * 0.3,
    scale: 8 + Math.random() * 4,
    offsetX: W * (0.3 + Math.random() * 0.4),
    offsetY: H * (0.3 + Math.random() * 0.4),
    phase: Math.random() * Math.PI * 2,
    ix: (Math.random() - 0.5) * 20,
    iy: (Math.random() - 0.5) * 20,
    iz: 20 + Math.random() * 10,
  });
  attractors[i].x = attractors[i].ix;
  attractors[i].y = attractors[i].iy;
  attractors[i].z = attractors[i].iz;
}

function stepAttractor(a, dt) {
  const dx = a.sigma * (a.y - a.x);
  const dy = a.x * (a.rho - a.z) - a.y;
  const dz = a.x * a.y - a.beta * a.z;
  a.x += dx * dt;
  a.y += dy * dt;
  a.z += dz * dt;
}

function getAttractorScreen(a, t) {
  const angle = t * 0.03 + a.phase;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const rx = a.x * cos - a.z * sin;
  const ry = a.y;
  return {
    x: a.offsetX + rx * a.scale,
    y: a.offsetY + ry * a.scale * 0.6
  };
}

// ── Particles ──
const MAX_PARTICLES = 2800;
const particles = [];

class Particle {
  constructor(x, y, attIdx) {
    this.x = x || Math.random() * W;
    this.y = y || Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.ox = this.x;
    this.oy = this.y;
    this.life = 0;
    this.maxLife = 400 + Math.random() * 600;
    this.attIdx = attIdx !== undefined ? attIdx : (Math.random() * NUM_ATTRACTORS) | 0;
    this.drift = Math.random() * 0.4 + 0.1;
    this.size = 0.3 + Math.random() * 0.7;
    this.hue = Math.random();
    this.orbitRadius = 20 + Math.random() * 80;
    this.orbitSpeed = (0.5 + Math.random() * 1.5) * (Math.random() < 0.5 ? 1 : -1);
    this.orbitAngle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
  }

  update(t) {
    this.life++;
    if (this.life > this.maxLife) return false;

    this.ox = this.x;
    this.oy = this.y;

    const att = attractors[this.attIdx];
    const target = getAttractorScreen(att, t);

    this.orbitAngle += this.orbitSpeed * 0.008;
    this.wobble += 0.02;
    const wobbleR = Math.sin(this.wobble) * 15;
    const orbitX = target.x + Math.cos(this.orbitAngle) * (this.orbitRadius + wobbleR);
    const orbitY = target.y + Math.sin(this.orbitAngle) * (this.orbitRadius + wobbleR) * 0.7;

    const dx = orbitX - this.x;
    const dy = orbitY - this.y;
    this.vx += dx * this.drift * 0.008;
    this.vy += dy * this.drift * 0.008;

    this.vx *= 0.96;
    this.vy *= 0.96;

    this.x += this.vx;
    this.y += this.vy;

    return true;
  }

  draw(ctx) {
    const progress = this.life / this.maxLife;
    const fadeIn = Math.min(this.life / 50, 1);
    const fadeOut = progress > 0.75 ? 1 - (progress - 0.75) / 0.25 : 1;
    const alpha = fadeIn * fadeOut;

    if (alpha <= 0.01) return;

    const h = this.hue;
    const r = 192 - h * 30;
    const g = 168 - h * 50 - progress * 20;
    const b = 120 + h * 70 + progress * 40;

    const dist = Math.hypot(this.x - this.ox, this.y - this.oy);
    if (dist > 0.5 && dist < 50) {
      ctx.strokeStyle = `rgba(${r|0},${g|0},${b|0},${alpha * 0.35})`;
      ctx.lineWidth = this.size;
      ctx.beginPath();
      ctx.moveTo(this.ox, this.oy);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
    }

    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alpha * 0.7})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Glow ──
function drawGlow(t) {
  ctx.globalCompositeOperation = 'lighter';
  for (const a of attractors) {
    const pos = getAttractorScreen(a, t);
    const pulse = 0.5 + Math.sin(t * 0.5 + a.phase) * 0.15;
    const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 120);
    grad.addColorStop(0, `rgba(192,168,120,${0.025 * pulse})`);
    grad.addColorStop(0.4, `rgba(170,150,130,${0.012 * pulse})`);
    grad.addColorStop(1, 'rgba(170,150,130,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 120, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ── Connections ──
function drawConnections() {
  const threshold = 60;
  const threshold2 = threshold * threshold;

  ctx.globalCompositeOperation = 'lighter';
  const sample = particles.length > 500
    ? particles.filter(() => Math.random() < 0.35)
    : particles;

  for (let i = 0; i < sample.length; i++) {
    const a = sample[i];
    const aProgress = a.life / a.maxLife;
    const aAlpha = Math.min(a.life / 50, 1) * (aProgress > 0.75 ? 1 - (aProgress - 0.75) / 0.25 : 1);
    if (aAlpha < 0.1) continue;

    for (let j = i + 1; j < sample.length; j++) {
      const b = sample[j];
      if (a.attIdx !== b.attIdx) continue;

      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > threshold2) continue;

      const bProgress = b.life / b.maxLife;
      const bAlpha = Math.min(b.life / 50, 1) * (bProgress > 0.75 ? 1 - (bProgress - 0.75) / 0.25 : 1);
      const d = Math.sqrt(d2);
      const lineAlpha = (1 - d / threshold) * aAlpha * bAlpha * 0.08;

      if (lineAlpha < 0.005) continue;

      ctx.strokeStyle = `rgba(192,168,120,${lineAlpha})`;
      ctx.lineWidth = 0.4;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ── Touch interaction ──
let touchAttractors = [];

function addTouchAttractor(x, y) {
  if (!interacted) {
    interacted = true;
    hint.classList.remove('show');
    hint.classList.add('fade');
  }

  const ta = {
    x, y,
    strength: 1,
    birth: time,
    life: 180 + Math.random() * 120,
  };
  touchAttractors.push(ta);

  const count = 30 + (Math.random() * 30) | 0;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 100;
    const p = new Particle(
      x + Math.cos(angle) * dist,
      y + Math.sin(angle) * dist,
      (Math.random() * NUM_ATTRACTORS) | 0
    );
    p.vx = (x - p.x) * 0.02;
    p.vy = (y - p.y) * 0.02;
    p.maxLife = 200 + Math.random() * 300;
    if (particles.length < MAX_PARTICLES + 200) {
      particles.push(p);
    }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  addTouchAttractor(e.clientX, e.clientY);
});

canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();
  if (e.buttons > 0 || e.pointerType === 'touch') {
    if (Math.random() < 0.25) {
      addTouchAttractor(e.clientX, e.clientY);
    }
  }
});

// ── Spawn ──
function spawnParticles() {
  while (particles.length < MAX_PARTICLES) {
    const attIdx = (Math.random() * NUM_ATTRACTORS) | 0;
    const att = attractors[attIdx];
    const pos = getAttractorScreen(att, time);
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 100;
    particles.push(new Particle(
      pos.x + Math.cos(angle) * dist,
      pos.y + Math.sin(angle) * dist,
      attIdx
    ));
  }
}

// ── Main loop ──
function frame() {
  time += 0.016;

  for (const a of attractors) {
    stepAttractor(a, 0.005);
    a.offsetX += Math.sin(time * 0.1 + a.phase) * 0.15;
    a.offsetY += Math.cos(time * 0.08 + a.phase * 1.3) * 0.1;
    a.offsetX = Math.max(W * 0.1, Math.min(W * 0.9, a.offsetX));
    a.offsetY = Math.max(H * 0.1, Math.min(H * 0.9, a.offsetY));
  }

  touchAttractors = touchAttractors.filter(ta => {
    const age = (time - ta.birth) * 60;
    ta.strength = 1 - age / ta.life;
    return ta.strength > 0;
  });

  for (const ta of touchAttractors) {
    for (const p of particles) {
      const dx = ta.x - p.x, dy = ta.y - p.y;
      const d = Math.hypot(dx, dy) + 1;
      if (d < 200) {
        const f = ta.strength * 0.3 / (d * 0.05 + 1);
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }
    }
  }

  // Fade
  ctx.fillStyle = 'rgba(6,5,10,0.12)';
  ctx.fillRect(0, 0, W, H);

  drawGlow(time);

  for (let i = particles.length - 1; i >= 0; i--) {
    if (particles[i].update(time)) {
      particles[i].draw(ctx);
    } else {
      particles.splice(i, 1);
    }
  }

  drawConnections();
  spawnParticles();

  requestAnimationFrame(frame);
}

// ── Init ──
resize();
window.addEventListener('resize', () => {
  const oldW = W, oldH = H;
  resize();
  for (const a of attractors) {
    a.offsetX *= W / oldW;
    a.offsetY *= H / oldH;
  }
});

ctx.fillStyle = '#06050a';
ctx.fillRect(0, 0, W, H);

spawnParticles();
setTimeout(() => hint.classList.add('show'), 1200);

frame();
</script>
</body>
</html>
