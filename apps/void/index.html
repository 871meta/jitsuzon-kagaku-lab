<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>void — 実存科学研究所</title>
<meta name="description" content="闇の中に触れる──実存科学研究所が提供するインタラクティブ体験。画面に触れると、金色の粒子が闇の中で反応し、やがて静寂に還る。言葉にならない何かを、ただ感じる。">
<link rel="canonical" href="https://jitsuzon-kagaku-lab.yanaihiroki.com/apps/void/index.html">
<meta property="og:title" content="void — 実存科学研究所">
<meta property="og:description" content="闇の中に触れる──実存科学研究所が提供するインタラクティブ体験。画面に触れると、金色の粒子が闇の中で反応する。">
<meta property="og:url" content="https://jitsuzon-kagaku-lab.yanaihiroki.com/apps/void/index.html">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06050a;
-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

// ── Resize ──
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

// ── Shaders ──
const vertSrc = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const fragSrc = `
precision highp float;

uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_touch;
uniform float u_touchStrength;

// --- Noise functions ---
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

// Fractal Brownian Motion
float fbm(vec3 p) {
  float f = 0.0;
  float amp = 0.5;
  float freq = 1.0;
  for (int i = 0; i < 6; i++) {
    f += amp * snoise(p * freq);
    freq *= 2.1;
    amp *= 0.48;
    p.xy = mat2(0.8, 0.6, -0.6, 0.8) * p.xy;
  }
  return f;
}

// Domain warping - creates the organic, flowing forms
float warpedNoise(vec3 p) {
  float t = u_time * 0.06;

  vec3 q = vec3(
    fbm(p + vec3(1.7, 9.2, 0.0) + t * 0.3),
    fbm(p + vec3(8.3, 2.8, 0.0) + t * 0.2),
    fbm(p + vec3(0.0, 0.0, t * 0.4))
  );

  vec3 r = vec3(
    fbm(p + 4.0 * q + vec3(1.7, 9.2, 0.0) + t * 0.15),
    fbm(p + 4.0 * q + vec3(8.3, 2.8, 0.0) + t * 0.12),
    0.0
  );

  return fbm(p + 3.5 * r);
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution;
  vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution) / min(u_resolution.x, u_resolution.y);

  // Touch distortion
  if (u_touchStrength > 0.01) {
    vec2 touchUV = u_touch / u_resolution * 2.0 - 1.0;
    touchUV.x *= u_resolution.x / u_resolution.y;
    p.x *= u_resolution.x / u_resolution.y;
    float d = length(p - touchUV);
    float influence = u_touchStrength * 0.4 / (d * 2.0 + 0.3);
    vec2 dir = normalize(p - touchUV + 0.001);
    p += dir * influence * 0.3;
    p.x /= u_resolution.x / u_resolution.y;
  }

  float t = u_time * 0.04;

  // Layer 1: Deep background flow
  float n1 = warpedNoise(vec3(p * 0.8, t * 0.5));

  // Layer 2: Mid-ground detail
  float n2 = warpedNoise(vec3(p * 1.5 + 3.0, t * 0.7));

  // Layer 3: Fine luminous detail
  float n3 = fbm(vec3(p * 2.5 + n1 * 0.5, t * 0.9));

  // Compose layers
  float base = n1 * 0.5 + 0.5;
  float detail = n2 * 0.3 + 0.5;
  float fine = n3 * 0.2 + 0.5;

  float luminance = base * 0.5 + detail * 0.3 + fine * 0.2;

  // Color palette: alcohol ink art — deep navy, purple, gold veins, lavender
  // Sampled from haikei2.jpg background image

  // Deep void / darkest navy
  vec3 c_void = vec3(0.03, 0.02, 0.06);

  // Deep navy blue
  vec3 c_navy = vec3(0.08, 0.06, 0.22);

  // Rich indigo-purple
  vec3 c_indigo = vec3(0.18, 0.10, 0.38);

  // Violet / purple
  vec3 c_violet = vec3(0.42, 0.22, 0.55);

  // Soft lavender (light areas)
  vec3 c_lavender = vec3(0.58, 0.50, 0.72);

  // Gold veins
  vec3 c_gold = vec3(0.78, 0.64, 0.32);

  // Bright gold highlights
  vec3 c_gold_hi = vec3(0.88, 0.76, 0.40);

  // Use separate noise layers for color channels (like real ink diffusion)
  float n_purple = warpedNoise(vec3(p * 0.9 + 1.0, t * 0.6));
  float purple_mask = smoothstep(-0.2, 0.6, n_purple);

  // Gold veins: sharp, thin lines using derivative of noise
  float n_gold_raw = fbm(vec3(p * 1.8 + n1 * 1.2, t * 0.3));
  float n_gold_edge = abs(n_gold_raw);
  float gold_vein = 1.0 - smoothstep(0.0, 0.08, n_gold_edge);
  // Broader gold glow around veins
  float gold_glow = 1.0 - smoothstep(0.0, 0.25, n_gold_edge);

  // Build color in layers like alcohol ink
  vec3 color = c_void;

  // Layer 1: Navy base
  float navy_mask = smoothstep(0.25, 0.55, luminance);
  color = mix(color, c_navy, navy_mask);

  // Layer 2: Indigo mid-tones
  float indigo_mask = smoothstep(0.35, 0.6, luminance) * smoothstep(0.5, 0.0, abs(n2));
  color = mix(color, c_indigo, indigo_mask * 0.8);

  // Layer 3: Purple / violet pools
  color = mix(color, c_violet, purple_mask * 0.55);

  // Layer 4: Lavender in the lightest areas
  float light_mask = smoothstep(0.6, 0.85, luminance);
  color = mix(color, c_lavender, light_mask * 0.4);

  // Layer 5: Gold veins threading through
  color = mix(color, c_gold, gold_glow * 0.3);
  color = mix(color, c_gold_hi, gold_vein * 0.7);

  // Subtle vignette
  float vig = 1.0 - length(uv - 0.5) * 0.8;
  vig = smoothstep(0.0, 1.0, vig);
  color *= vig;

  // Very subtle film grain
  float grain = (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.015;
  color += grain;

  gl_FragColor = vec4(color, 1.0);
}
`;

// ── Compile shaders ──
function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const vs = createShader(gl.VERTEX_SHADER, vertSrc);
const fs = createShader(gl.FRAGMENT_SHADER, fragSrc);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
gl.useProgram(prog);

// ── Geometry: fullscreen quad ──
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// ── Uniforms ──
const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes = gl.getUniformLocation(prog, 'u_resolution');
const uTouch = gl.getUniformLocation(prog, 'u_touch');
const uTouchStr = gl.getUniformLocation(prog, 'u_touchStrength');

// ── Touch state ──
let touchX = 0, touchY = 0;
let touchStrength = 0;
let touching = false;

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  touching = true;
  touchX = e.clientX * (canvas.width / canvas.clientWidth);
  touchY = (canvas.clientHeight - e.clientY) * (canvas.height / canvas.clientHeight);
  touchStrength = 1.0;
});

canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();
  if (touching) {
    touchX = e.clientX * (canvas.width / canvas.clientWidth);
    touchY = (canvas.clientHeight - e.clientY) * (canvas.height / canvas.clientHeight);
  }
});

canvas.addEventListener('pointerup', () => { touching = false; });
canvas.addEventListener('pointercancel', () => { touching = false; });

// ── Render loop ──
let startTime = performance.now();

function frame() {
  const t = (performance.now() - startTime) * 0.001;

  // Fade touch strength
  if (!touching) {
    touchStrength *= 0.96;
  }

  gl.uniform1f(uTime, t);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform2f(uTouch, touchX, touchY);
  gl.uniform1f(uTouchStr, touchStrength);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
